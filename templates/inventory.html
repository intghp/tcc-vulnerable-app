<!DOCTYPE html>
<html lang="pt">
<head><title>SGA - Inventário</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold mb-4">Pesquisa de Inventário</h1>
    <form action="/inventario/buscar" method="get" class="flex space-x-2 mb-6">
      <input type="text" name="termo" value="{{ termo }}" placeholder="Digite o nome do ativo..." class="border rounded px-4 py-2 w-full">
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Buscar</button>
    </form>
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100 text-gray-700">
          <th class="p-3 border-b">Equipamento</th>
          <th class="p-3 border-b">Valor</th>
          <th class="p-3 border-b">Status</th>
        </tr>
      </thead>
      <tbody>
        {% for row in resultados %}
        <tr>
          <td class="p-3 border-b">{{ row[0] }}</td>
          <td class="p-3 border-b">{{ row[1] }}</td>
          <td class="p-3 border-b">{{ row[2] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="mt-4"><a href="/dashboard" class="text-blue-600 hover:underline">← Voltar</a></div>
  </div>
</body>
</html>
