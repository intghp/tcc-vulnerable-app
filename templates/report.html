<!DOCTYPE html>
<html lang="pt">
<head><title>SGA - Relatório</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold mb-4">Relatório de Retiradas</h1>
    <form action="/relatorios/retiradas" method="get" class="flex space-x-2 mb-6">
      <input type="text" name="nome" value="{{ nome }}" placeholder="Nome do colaborador (Ex: Maria)" class="border rounded px-4 py-2 w-full">
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Filtrar</button>
    </form>
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100 text-gray-700">
          <th class="p-3 border-b">#</th>
          <th class="p-3 border-b">Equipamento</th>
          <th class="p-3 border-b">Colaborador</th>
          <th class="p-3 border-b">Valor</th>
          <th class="p-3 border-b">Data</th>
        </tr>
      </thead>
      <tbody>
        {% for r in resultados %}
        <tr>
          <td class="p-3 border-b">{{ r.id }}</td>
          <td class="p-3 border-b">{{ r.equipamento }}</td>
          <td class="p-3 border-b">{{ r.nome }}</td>
          <td class="p-3 border-b">R$ {{ "%.2f"|format(r.valor) }}</td>
          <td class="p-3 border-b">{{ r.data }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="mt-4"><a href="/dashboard" class="text-blue-600 hover:underline">← Voltar</a></div>
  </div>
</body>
</html>
