name: TCC DevSecOps - SAST (Bandit) e DAST (OWASP ZAP)

on:
  push:
    branches: [ "vulns" ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # JOB 1: SAST (Análise Estática de Código com Bandit)
  # ==========================================================
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Bandit
        run: pip install bandit

      - name: Executar varredura SAST
        run: |
          bandit -r . -f html -o bandit-report.html || true
          bandit -r . -f json -o bandit-report.json || true

      - name: Exportar Relatório Bandit (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast-bandit
          path: |
            bandit-report.html
            bandit-report.json

  # ==========================================================
  # JOB 2: DAST (Análise Dinâmica com OWASP ZAP)
  # ==========================================================
  dast-owasp-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do SGA
        run: pip install -r requirements.txt

      - name: Iniciar aplicação FastAPI (Porta 8000)
        run: |
          nohup python run.py > app.log 2>&1 &
          sleep 5

      - name: Gerar Cookie de Sessão Autenticada para o ZAP
        run: |
          TOKEN=$(curl -s -i -X POST http://localhost:8000/login \
            -d "matricula=COL-002&senha=col002" | grep -i "set-cookie:" | sed -E 's/.*sga_token=([^;]+).*/\1/' | tr -d '\r')
          echo "ZAP_AUTH_HEADER_VALUE=sga_token=$TOKEN" >> $GITHUB_ENV

      - name: Executar OWASP ZAP Full Scan (Ataque Ativo)
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          cmd_options: '-z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${{ env.ZAP_AUTH_HEADER_VALUE }}"'

      - name: Exportar Relatório OWASP ZAP (Artefato)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-dast-zap
          path: report_html.html
